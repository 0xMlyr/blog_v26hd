<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>文章列表</title>
    <meta name="description" content="一个极简的 Markdown 博客">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body data-page="list">
    <main class="page">
      <header class="site-header">
        <h1>文章</h1>
        <p class="subtitle">一个极简的 Markdown 阅读空间</p>
      </header>
      <section aria-labelledby="list-heading">
        <h2 id="list-heading" class="sr-only">全部文章</h2>
        <p id="status" class="status">加载中...</p>
        <ul id="article-list" class="article-list" hidden></ul>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
