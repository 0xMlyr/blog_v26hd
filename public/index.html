<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>文章列表</title>
    <meta name="description" content="一个极简的 Markdown 博客">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body data-page="list">
    <main class="home">
      <section class="hero" aria-labelledby="site-title">
        <h1 id="site-title" class="site-title">
          <span>不可言者当以缄默</span>
          <span class="site-title-separator breathe" aria-hidden="true">丶</span>
          <span>心之所处即是乐园</span>
        </h1>
        <a class="scroll-hint" href="#articles" aria-label="查看文章列表">↓</a>
      </section>
      <section id="articles" class="page list-section" aria-labelledby="list-heading">
        <h2 id="list-heading" class="sr-only">全部文章</h2>
        <p id="status" class="status">加载中...</p>
        <ul id="article-list" class="article-list" hidden></ul>
      </section>
    </main>
    <footer class="site-footer">
      <p>© Copyright by MLYR 2026</p>
    </footer>
    <script src="/app.js" defer></script>
  </body>
</html>
